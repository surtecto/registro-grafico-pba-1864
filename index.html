<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro Gráfico 1864 · Provincia de Buenos Aires · SIG</title>
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--paper:#efe4cc;--paper2:#e4d5b4;--ink:#2b2115;--ink2:#5a4a33;--rule:#b9a57c;--accent:#8b2e16;--water:#2f5d73;--geo:#5b6b2e;--town:#1d1d1d;--estado:#b07a1a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper)}
header{height:58px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:2px solid var(--ink);background:var(--paper)}
header h1{font-family:'IM Fell English SC',serif;font-weight:400;font-size:24px;margin:0;letter-spacing:.5px;white-space:nowrap}
header .sub{font-size:12px;color:var(--ink2);line-height:1.2}
nav{margin-left:auto;display:flex;gap:4px}
nav button{font:500 13px 'IBM Plex Sans';background:transparent;border:1px solid var(--ink);color:var(--ink);padding:7px 12px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--paper)}
main{position:absolute;top:58px;bottom:0;left:0;right:0;display:flex}
aside{width:340px;min-width:340px;border-right:1px solid var(--rule);overflow:auto;background:var(--paper);padding:14px 16px}
#mapwrap{flex:1;position:relative}
#map,#orig{position:absolute;inset:0}
#orig{display:none;background:#141414}
#stats,#about{position:absolute;inset:0;overflow:auto;display:none;background:var(--paper);padding:26px 34px}
h2{font-family:'IM Fell English SC',serif;font-weight:400;font-size:20px;margin:18px 0 8px;border-bottom:1px solid var(--rule);padding-bottom:4px}
h2:first-child{margin-top:0}
label{font-size:13px}
.row{display:flex;align-items:center;gap:8px;margin:5px 0}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.4)}
input[type=search],select{width:100%;font:14px 'IBM Plex Sans';padding:8px 10px;border:1px solid var(--ink2);background:#fbf6ea;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
#results{margin-top:8px;max-height:300px;overflow:auto;border-top:1px solid var(--rule)}
#results div{padding:6px 2px;border-bottom:1px dotted var(--rule);cursor:pointer;font-size:13px}
#results div:hover{background:var(--paper2)}
#results small{color:var(--ink2);display:block;font-size:11px}
.muted{color:var(--ink2);font-size:12px;line-height:1.45}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.card{border:1px solid var(--ink);padding:12px;background:#f7efdc}
.card b{display:block;font:400 32px 'IM Fell English SC',serif;line-height:1}
.card span{font-size:12px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:26px}
.bar{display:grid;grid-template-columns:170px 1fr 44px;align-items:center;gap:8px;font-size:13px;margin:3px 0}
.bar i{display:block;height:12px;background:var(--ink2)}
.bar em{font-style:normal;text-align:right;font-family:'IBM Plex Mono';font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--rule);padding:5px 6px;text-align:left}
th{cursor:pointer;background:var(--paper2);position:sticky;top:0}
td.n{font-family:'IBM Plex Mono';text-align:right}
.leaflet-popup-content{font-family:'IBM Plex Sans';font-size:13px}
.leaflet-popup-content h4{margin:0 0 4px;font-family:'IM Fell English SC',serif;font-weight:400;font-size:17px}
.pop a{color:var(--accent);cursor:pointer}
.tlabel{font:600 11px 'IBM Plex Sans';color:#111;text-shadow:0 0 3px #fff,0 0 3px #fff;background:none;border:none;box-shadow:none}
.plabel{font:400 15px 'IM Fell English SC',serif;color:#6b1d0c;text-shadow:0 0 3px #fff8,0 0 4px #fff;background:none;border:none;box-shadow:none}
.zlow .tlabel,.zvlow .plabel{display:none}
.leaflet-tooltip.tlabel:before,.leaflet-tooltip.plabel:before{display:none}
.dl a{display:inline-block;margin:3px 6px 3px 0;font-size:12px;color:var(--accent)}
.note{border-left:3px solid var(--accent);padding:6px 10px;background:#f6ead0;font-size:12px;margin:10px 0}
@media (max-width:820px){aside{display:none}header h1{font-size:18px}header .sub{display:none}}
</style>
</head>
<body>
<header>
  <h1>Registro Gráfico · 1864</h1>
  <div class="sub">Propiedades rurales de la Provincia de Buenos Aires<br>Departamento Topográfico · SIG histórico</div>
  <nav>
    <button data-v="map" class="on">Mapa georreferenciado</button>
    <button data-v="orig">Lámina original</button>
    <button data-v="stats">Estadística</button>
    <button data-v="about">Método</button>
  </nav>
</header>
<main>
<aside>
  <h2>Buscar</h2>
  <input id="q" type="search" placeholder="Propietario, pueblo, laguna, arroyo…">
  <div class="row" style="gap:6px;margin-top:8px">
    <select id="fpart"><option value="">Todos los partidos</option></select>
  </div>
  <div class="row"><select id="ftipo"><option value="">Todo tipo de titular</option></select></div>
  <div id="results"></div>
  <h2>Capas</h2>
  <div id="layers"></div>
  <h2>Lámina 1864</h2>
  <label>Opacidad del plano sobre la imagen satelital</label>
  <input id="op" type="range" min="0" max="100" value="80">
  <div class="row"><label><input type="radio" name="base" value="esri" checked> Esri World Imagery</label></div>
  <div class="row"><label><input type="radio" name="base" value="google"> Google satélite</label></div>
  <div class="row"><label><input type="radio" name="base" value="osm"> OpenStreetMap</label></div>
  <p class="muted">Clic en un punto para ver su ficha. Desde la ficha se puede saltar a la misma ubicación en la lámina original sin deformar.</p>
  <h2>Descargas</h2>
  <div class="dl" id="dl"></div>
</aside>
<div id="mapwrap">
  <div id="map"></div>
  <div id="orig"></div>
  <div id="stats"></div>
  <div id="about"></div>
</div>
</main>
<script src="lib/leaflet.js"></script>
<script>
const LAYERS=[
 {k:'partidos',f:'partidos_aprox.geojson',name:'Partidos (límite aproximado)',on:true,color:'#8b2e16'},
 {k:'parcelas',f:'parcelas_aprox.geojson',name:'Zonas de propiedad (aprox.)',on:false,color:'#7d6a44'},
 {k:'propietarios',f:'propietarios.geojson',name:'Propietarios',on:true,color:'#2b2115'},
 {k:'poblados',f:'poblados.geojson',name:'Pueblos y ciudades',on:true,color:'#d8c48a'},
 {k:'hidrografia',f:'hidrografia.geojson',name:'Hidrografía',on:true,color:'#2f5d73'},
 {k:'geografia',f:'geografia.geojson',name:'Geografía, fortines, estancias',on:true,color:'#5b6b2e'},
 {k:'rotulos',f:'rotulos.geojson',name:'Rótulos de partidos y secciones',on:false,color:'#6b1d0c'},
 {k:'control',f:'puntos_control.geojson',name:'Puntos de control (georref.)',on:false,color:'#e0e000'}];
const TIPOCOL={'Particular':'#2b2115','Sucesión / herederos':'#6a3d9a','Estado / tierra pública':'#b07a1a','Sociedad / colectivo':'#1f6f5c'};
const DATA={},GL={},OL={};let STATS=null,ALL=[];
// ---------- georeferenced map ----------
const map=L.map('map',{zoomControl:true,preferCanvas:true,maxZoom:15}).setView([-35.6,-59.3],7);
const bases={
 esri:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Imagen © Esri, Maxar, Earthstar Geographics',maxZoom:19}),
 google:L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{attribution:'Imagen © Google',maxZoom:20}),
 osm:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19})};
const refl=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:.7});
let base=bases.esri.addTo(map); refl.addTo(map);
document.querySelectorAll('input[name=base]').forEach(r=>r.onchange=()=>{map.removeLayer(base);base=bases[r.value].addTo(map);base.bringToBack();});
map.createPane('plano');map.getPane('plano').style.zIndex=350;
const plano=L.tileLayer('tiles/geo/{z}/{x}/{y}.webp',{pane:'plano',minZoom:3,maxNativeZoom:11,minNativeZoom:5,maxZoom:15,opacity:.8,bounds:[[-40.08,-63.1],[-32.78,-55.51]],attribution:'Registro Gráfico 1864 · Dpto. Topográfico (copia AGN)'}).addTo(map);
const zcls=()=>{const z=map.getZoom(),c=document.getElementById('map');c.classList.toggle('zlow',z<9);c.classList.toggle('zvlow',z<7);};map.on('zoomend',zcls);zcls();
document.getElementById('op').oninput=e=>plano.setOpacity(e.target.value/100);
// ---------- original sheet ----------
const orig=L.map('orig',{crs:L.CRS.Simple,minZoom:0,maxZoom:8,zoomSnap:.25});
const OW=8504,OH=10835,OZ=6;
const ob=L.latLngBounds(orig.unproject([0,OH],OZ),orig.unproject([OW,0],OZ));
L.tileLayer('tiles/orig/{z}/{x}/{y}.jpg',{maxNativeZoom:6,maxZoom:8,bounds:ob,noWrap:true}).addTo(orig);
orig.setMaxBounds(ob.pad(.2));
const pxll=(x,y)=>orig.unproject([x,y],OZ);
// ---------- helpers ----------
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popup(p,ll){
  const cat={OWN:'Propietario',TOWN:'Poblado',HYD:'Hidrografía',GEO:'Geografía',OTHER:'Nota del plano',PART:'Número de partido',SEC:'Sección / rótulo',PNAME:'Nombre de partido'}[p.categoria]||'';
  let h=`<div class="pop"><h4>${esc(p.nombre||p.propietario)}</h4>${cat}${p.tipo?' · '+esc(p.tipo):''}<br>`;
  if(p.partido) h+=`Partido ${p.partido_n}: <b>${esc(p.partido)}</b><br>`;
  if(p.apellido) h+=`Apellido: ${esc(p.apellido)}<br>`;
  if(ll) h+=`<span class="muted">${ll.lat.toFixed(4)}, ${ll.lng.toFixed(4)} (±5–7 km)</span><br>`;
  if(p.px!=null) h+=`<a onclick="goOrig(${p.px},${p.py})">Ver en la lámina original →</a>`;
  return h+'</div>';
}
function goOrig(x,y){show('orig');orig.setView(pxll(x,y),6.5);
  const m=L.circleMarker(pxll(x,y),{radius:22,color:'#ff3b00',weight:3,fill:false}).addTo(orig);setTimeout(()=>orig.removeLayer(m),4000);}
function goMap(lat,lng){show('map');map.setView([lat,lng],11);}
window.goOrig=goOrig;
function ptStyle(k,p){
  if(k==='propietarios') return {radius:4,color:'#fff',weight:1,fillColor:TIPOCOL[p.tipo]||'#2b2115',fillOpacity:.95};
  if(k==='poblados') return {radius:7,color:'#111',weight:2,fillColor:'#f3d77a',fillOpacity:1};
  if(k==='hidrografia') return {radius:4,color:'#fff',weight:1,fillColor:'#2f7da0',fillOpacity:.95};
  if(k==='geografia') return {radius:4,color:'#fff',weight:1,fillColor:p.tipo==='Fortín'?'#c0392b':'#6b7d2e',fillOpacity:.95};
  if(k==='control') return {radius:5,color:'#000',weight:1,fillColor:'#ffef00',fillOpacity:1};
  return {radius:3,color:'#6b1d0c',fillOpacity:1};
}
let partSel='',tipoSel='';
function passes(p){return (!partSel||String(p.partido_n)===partSel)&&(!tipoSel||p.tipo===tipoSel);}
function makeGeo(k,gj){
  if(k==='partidos') return L.geoJSON(gj,{style:f=>({color:'#8b2e16',weight:1.6,dashArray:'6 3 1 3',fill:true,fillOpacity:partSel&&String(f.properties.n)===partSel?.18:0.02,fillColor:'#8b2e16'}),
    onEachFeature:(f,l)=>{l.bindTooltip(`${f.properties.n} · ${f.properties.nombre}`,{permanent:true,direction:'center',className:'plabel'});
      l.bindPopup(`<div class="pop"><h4>${f.properties.n} · ${esc(f.properties.nombre)}</h4>Propietarios relevados: ${f.properties.propietarios}<br>Superficie aprox.: ${f.properties.area_aprox_km2.toLocaleString('es')} km²<br><span class="muted">Límite aproximado</span></div>`)}});
  if(k==='parcelas') return L.geoJSON(gj,{filter:f=>passes(f.properties),style:f=>({color:'#3b2f1c',weight:.7,fillColor:TIPOCOL[f.properties.tipo],fillOpacity:.15}),
    onEachFeature:(f,l)=>l.bindPopup(popup({...f.properties,nombre:f.properties.propietario}))});
  return L.geoJSON(gj,{filter:f=>passes(f.properties),pointToLayer:(f,ll)=>L.circleMarker(ll,ptStyle(k,f.properties)),
    onEachFeature:(f,l)=>{l.bindPopup(()=>popup(f.properties,l.getLatLng()));
      if(k==='poblados') l.bindTooltip(f.properties.nombre,{permanent:true,direction:'right',offset:[8,0],className:'tlabel'});
      else l.bindTooltip(f.properties.nombre||'',{direction:'top'});}});
}
function makeOrig(k,gj){
  if(!['propietarios','poblados','hidrografia','geografia','rotulos'].includes(k)) return null;
  const g=L.layerGroup();
  gj.features.filter(f=>passes(f.properties)).forEach(f=>{const p=f.properties;const m=L.circleMarker(pxll(p.px,p.py),{...ptStyle(k,p),radius:4,fillOpacity:.75});
    m.bindTooltip(p.nombre,{direction:'top'});m.bindPopup(`<div class="pop"><h4>${esc(p.nombre)}</h4>${p.partido?`Partido ${p.partido_n}: ${esc(p.partido)}<br>`:''}<a onclick="goMap(${f.geometry.coordinates[1]},${f.geometry.coordinates[0]})">Ver georreferenciado →</a></div>`);g.addLayer(m);});
  return g;
}
window.goMap=goMap;
const vis={};
function redraw(k){
  if(GL[k]) map.removeLayer(GL[k]); if(OL[k]) orig.removeLayer(OL[k]);
  GL[k]=makeGeo(k,DATA[k]); OL[k]=makeOrig(k,DATA[k]);
  if(vis[k]){GL[k].addTo(map); if(OL[k]) OL[k].addTo(orig);}
}
const lyrDiv=document.getElementById('layers'),dl=document.getElementById('dl');
LAYERS.forEach(L_=>{vis[L_.k]=L_.on;
  lyrDiv.insertAdjacentHTML('beforeend',`<div class="row"><label><input type="checkbox" data-k="${L_.k}" ${L_.on?'checked':''}> <span class="sw" style="background:${L_.color}"></span> ${L_.name}</label></div>`);
  dl.insertAdjacentHTML('beforeend',`<a href="data/${L_.f}" download>${L_.f}</a>`);});
dl.insertAdjacentHTML('beforeend','<a href="data/estadisticas.json" download>estadisticas.json</a><a href="data/propietarios.csv" download>propietarios.csv</a>');
lyrDiv.querySelectorAll('input').forEach(cb=>cb.onchange=()=>{const k=cb.dataset.k;vis[k]=cb.checked;
  if(!GL[k])return; if(cb.checked){GL[k].addTo(map);OL[k]&&OL[k].addTo(orig);}else{map.removeLayer(GL[k]);OL[k]&&orig.removeLayer(OL[k]);}});
Promise.all(LAYERS.map(l=>fetch('data/'+l.f).then(r=>r.json()).then(j=>{DATA[l.k]=j;}))).then(()=>{
  ['partidos','parcelas','propietarios','hidrografia','geografia','rotulos','control','poblados'].forEach(redraw);
  ['propietarios','poblados','hidrografia','geografia'].forEach(k=>DATA[k].features.forEach(f=>ALL.push({...f.properties,lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],k})));
  const fp=document.getElementById('fpart');
  DATA.partidos.features.map(f=>f.properties).sort((a,b)=>a.n-b.n).forEach(p=>fp.insertAdjacentHTML('beforeend',`<option value="${p.n}">${p.n} · ${esc(p.nombre)}</option>`));
  const ft=document.getElementById('ftipo');Object.keys(TIPOCOL).forEach(t=>ft.insertAdjacentHTML('beforeend',`<option>${t}</option>`));
  fp.onchange=()=>{partSel=fp.value;['partidos','parcelas','propietarios','hidrografia','geografia','poblados'].forEach(redraw);
    if(partSel){const f=DATA.partidos.features.find(f=>String(f.properties.n)===partSel);map.fitBounds(L.geoJSON(f).getBounds());}search();};
  ft.onchange=()=>{tipoSel=ft.value;['parcelas','propietarios'].forEach(redraw);search();};
  search();
});
fetch('data/estadisticas.json').then(r=>r.json()).then(s=>{STATS=s;renderStats();});
// ---------- search ----------
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function search(){
  const q=norm(document.getElementById('q').value.trim()),res=document.getElementById('results');
  let r=ALL.filter(o=>(!q||norm(o.nombre).includes(q)||norm(o.partido).includes(q))&&passes(o));
  const n=r.length; r=r.slice(0,150);
  res.innerHTML=`<p class="muted">${n} resultado${n===1?'':'s'}${n>150?' (se muestran 150)':''}</p>`+r.map((o,i)=>`<div data-i="${i}"><span class="sw" style="background:${o.k==='propietarios'?TIPOCOL[o.tipo]:LAYERS.find(l=>l.k===o.k).color}"></span> ${esc(o.nombre)}<small>${o.partido?o.partido_n+' · '+esc(o.partido):''}${o.tipo?' · '+esc(o.tipo):''}</small></div>`).join('');
  res.querySelectorAll('div[data-i]').forEach(d=>d.onclick=()=>{const o=r[+d.dataset.i];
    if(document.getElementById('orig').style.display==='block'){goOrig(o.px,o.py);return;}
    show('map');map.setView([o.lat,o.lng],11);L.popup().setLatLng([o.lat,o.lng]).setContent(popup(o,L.latLng(o.lat,o.lng))).openOn(map);});
}
document.getElementById('q').oninput=search;
// ---------- views ----------
function show(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  ['map','orig','stats','about'].forEach(id=>document.getElementById(id).style.display=id===v?'block':'none');
  if(v==='map')map.invalidateSize(); if(v==='orig'){orig.invalidateSize(); if(!orig._loaded) orig.fitBounds(ob);}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
window.show=show;
// ---------- stats ----------
function bars(arr,color){const m=Math.max(...arr.map(a=>a[1]));return arr.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${100*v/m}%;background:${color||'var(--ink2)'}"></i><em>${v}</em></div>`).join('');}
function renderStats(){
  const s=STATS,t=s.totales;
  let h=`<h2>Panorama del registro</h2><div class="cards">
   <div class="card"><b>${t.propietarios}</b><span>rótulos de propietario transcriptos</span></div>
   <div class="card"><b>${t.propietarios_distintos}</b><span>titulares distintos</span></div>
   <div class="card"><b>${t.partidos_localizados}</b><span>partidos localizados (de ${t.partidos_lista})</span></div>
   <div class="card"><b>${t.poblados}</b><span>pueblos y ciudades</span></div>
   <div class="card"><b>${t.hidrografia}</b><span>lagunas, arroyos, ríos, cañadas</span></div>
   <div class="card"><b>${t.geografia}</b><span>fortines, sierras, estancias, parajes</span></div>
   <div class="card"><b>${t.puntos_control}</b><span>puntos de control del georreferenciado</span></div></div>
   <div class="note">Las cifras describen lo transcripto del plano, no la totalidad de las propiedades. En los partidos del norte, donde las suertes de chacra y estancia son muy angostas, una parte de los rótulos menores quedó sin transcribir; por eso el número de propietarios por partido mide densidad de registro, no cantidad real de titulares.</div>
   <div class="grid2"><div><h2>Tipo de titular</h2>${bars(s.tipos_propietario.map(([k,v])=>[k,v]))}
   <p class="muted">«Estado / tierra pública» reúne los rótulos «El Estado», «conocido por de…» y «pedido por varios»: tierras fiscales en enfiteusis, ocupadas o solicitadas en compra, casi todas sobre la frontera sur.</p></div>
   <div><h2>Apellidos más frecuentes</h2>${bars(s.apellidos_top.slice(0,20),'#8b2e16')}</div>
   <div><h2>Titulares con más de una suerte</h2>${bars(s.propietarios_repetidos.slice(0,15),'#6a3d9a')}</div>
   <div><h2>Hidrografía</h2>${bars(s.hidro_tipos,'#2f7da0')}<h2>Geografía y ocupación</h2>${bars(s.geo_tipos,'#6b7d2e')}</div></div>
   <h2>Partidos</h2><p class="muted">Clic en un encabezado para ordenar. Superficie calculada sobre el polígono aproximado.</p>
   <table id="tp"><thead><tr><th data-c="n">N°</th><th data-c="nombre">Partido</th><th data-c="propietarios">Propietarios</th><th data-c="estado">Tierra pública</th><th data-c="hidro">Hidrografía</th><th data-c="area_aprox_km2">km² aprox.</th><th>Poblados</th></tr></thead><tbody></tbody></table>
   <h2>Lista oficial de partidos (Explicación del plano)</h2><p class="muted">${s.lista_partidos.map(p=>`${p.n} ${esc(p.nombre)}${p.localizado?'':' <b style="color:#8b2e16">(sin localizar)</b>'}`).join(' · ')}. Los números 33 a 35 fueron saltados por error en la numeración original: los partidos de campaña son 72.</p>`;
  document.getElementById('stats').innerHTML=h;
  let rows=s.partidos.slice(),key='n',asc=true;
  const draw=()=>{rows.sort((a,b)=>(a[key]>b[key]?1:-1)*(asc?1:-1));document.querySelector('#tp tbody').innerHTML=rows.map(p=>`<tr><td class="n">${p.n}</td><td><a style="color:var(--accent);cursor:pointer" onclick="selPart(${p.n})">${esc(p.nombre)}</a></td><td class="n">${p.propietarios}</td><td class="n">${p.estado}</td><td class="n">${p.hidro}</td><td class="n">${p.area_aprox_km2.toLocaleString('es')}</td><td>${p.poblados.map(esc).join(', ')}</td></tr>`).join('');};
  document.querySelectorAll('#tp th[data-c]').forEach(th=>th.onclick=()=>{asc=key===th.dataset.c?!asc:true;key=th.dataset.c;draw();});draw();
}
window.selPart=n=>{const fp=document.getElementById('fpart');fp.value=String(n);fp.onchange();show('map');};
// ---------- about ----------
document.getElementById('about').innerHTML=`<h2>Fuente</h2>
<p><b>Registro Gráfico de las propiedades rurales de la Provincia de Buenos Aires</b>, construido por el Departamento Topográfico y publicado con autorización del Supremo Gobierno de la Provincia, 1864 (S. Salas, M. Moreno, G. Kuhr, P. Benoit, Y. Casagemas, A. E. Malaver). La «Explicación» del propio plano fija los límites de partidos según los decretos del 24 de febrero y 31 de agosto de 1865 y la línea de fronteras de los decretos de julio de 1858. Se trabajó sobre la reproducción digital del Archivo General de la Nación (8504 × 10835 px). Existe además una edición digital en 64 hojas (CD del Archivo Histórico Municipal de Olavarría, 2008).</p>
<h2>Georreferenciación</h2>
<p>La lámina está dibujada con el sur arriba. Se identificaron 44 puntos de control (pueblos cabecera, Buenos Aires, Colonia, Cabo Corrientes, Bahía Blanca, entre otros) y se ajustó una transformación polinómica de 2.º grado con corrección de residuos por <i>thin plate spline</i>, en EPSG:3857. El error estimado por validación cruzada (dejando un punto afuera) es de unos 7 km RMS, con mediana de 4 km; es mayor hacia Bahía Blanca y en los bordes, donde hay pocos puntos de control. Esa magnitud no es un defecto del ajuste: es la precisión propia de un plano compilado en 1864 a partir de mensuras heterogéneas, con una proyección no declarada. La lámina inserta del Partido de Patagones, la Explicación y la cartela del título quedan fuera del georreferenciado; se pueden ver completas en «Lámina original».</p>
<h2>Transcripción y capas</h2>
<p>Los rótulos se leyeron sobre la lámina en recuadros de alta resolución y se registraron con su posición en píxeles de la imagen original. Esa posición es la que vincula cada registro con la lámina y con el mapa georreferenciado. Las grafías se normalizaron con tildes modernas (Vásquez, Yraola, Ygnacio se conservan como figuran). Las lecturas dudosas o parciales se dejaron tal cual («Herederos de Antonio», «Nicolás B.»).</p>
<p><b>Partidos:</b> los polígonos son una aproximación por Voronoi a partir de los números grandes de partido; no son un calcado de la línea punteada del plano. Sirven para asignar cada rótulo a su partido y comparar órdenes de magnitud. <b>Zonas de propiedad:</b> celdas de Voronoi de cada rótulo, recortadas por el partido y por un radio máximo. Muestran el área de influencia del nombre, no el deslinde real de la suerte.</p>
<div class="note">Lo que queda por hacer para un SIG catastral completo: calcar las líneas de deslinde de cada suerte (vectorización manual asistida), transcribir los rótulos menores de los partidos del norte y vincular los números pequeños de cada propiedad con los duplicados de mensura del Archivo de Geodesia.</div>
